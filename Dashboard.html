<!DOCTYPE html>
<html>
<head>
  <title>ESP32 eCO₂ + TVOC Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    h2 {
      text-align: center;
    }
    #chart {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h2>ESP32 Air Quality Monitor</h2>
  <canvas id="chart" width="800" height="400"></canvas>

  <script>
    let chart;

    // This function uses the API we created to grab the DynamoDB
    async function fetchData() {
      const response = await fetch("https://youramazonAPIhere.amazonaws.com/esp32DataVisual");
      const data = await response.json();

      const timestamps = data.map(item => item.timestamp);
      const eco2 = data.map(item => item.eco2);
      const tvoc = data.map(item => item.tvoc);

      return { timestamps, eco2, tvoc };
    }

    // This function uses the fetchData declared above to add the data to the charts datasets
    async function updateChart() {
      const { timestamps, eco2, tvoc } = await fetchData();

      chart.data.labels = timestamps;
      chart.data.datasets[0].data = eco2;
      chart.data.datasets[1].data = tvoc;
      chart.update();
    }

    // This whole function uese the chart.js library to create a chart based on timestamps, eco2, and tvoc then stylizes the graph
    async function renderChart() {
      const { timestamps, eco2, tvoc } = await fetchData();

      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timestamps,
          datasets: [
            {
              label: 'eCO₂ (ppm)',
              data: eco2,
              borderColor: 'rgba(75, 192, 192, 1)',
              backgroundColor: 'rgba(75, 192, 192, 0.2)',
              tension: 0.3,
              fill: true,
              pointRadius: 2
            },
            {
              label: 'TVOC (ppb)',
              data: tvoc,
              borderColor: 'rgba(255, 99, 132, 1)',
              backgroundColor: 'rgba(255, 99, 132, 0.2)',
              tension: 0.3,
              fill: true,
              pointRadius: 2
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: 'index',
            intersect: false
          },
          scales: {
            x: {
              title: {
                display: true,
                text: 'Timestamp'
              }
            },
            y: {
              title: {
                display: true,
                text: 'Air Quality Reading'
              },
              beginAtZero: true
            }
          }
        }
      });
    }

    // updating the chart every 10 seconds to keep 'real-time'
    renderChart().then(() => {
      setInterval(updateChart, 10000);
    });
  </script>
</body>
</html>
